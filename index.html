<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Font Side-Bearing Fixer</title>
    <script src="https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
:root{color-scheme:light;--page:#e9edf1;--panel:#fff;--surface:#f3f5f7;--field:#fff;--text:#202830;--muted:#687581;--line:#c8d0d8;--accent:#315d83;--accent-hover:#244968;--drop:#f5f8fb;--drop-hover:#eaf1f7;--success-bg:#edf5ef;--success:#285d3b;--error-bg:#f8eeee;--error:#8a3434;--processing-bg:#edf2f7;--processing:#315d83}
:root[data-theme="dark"]{color-scheme:dark;--page:#15191e;--panel:#20262d;--surface:#272f38;--field:#171c22;--text:#e7ebef;--muted:#9ba7b2;--line:#414c57;--accent:#8fb6d8;--accent-hover:#b1cde5;--drop:#1b242d;--drop-hover:#263442;--success-bg:#203329;--success:#a8d5b5;--error-bg:#392526;--error:#efaaaa;--processing-bg:#263341;--processing:#b5d0e8}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--page:#15191e;--panel:#20262d;--surface:#272f38;--field:#171c22;--text:#e7ebef;--muted:#9ba7b2;--line:#414c57;--accent:#8fb6d8;--accent-hover:#b1cde5;--drop:#1b242d;--drop-hover:#263442;--success-bg:#203329;--success:#a8d5b5;--error-bg:#392526;--error:#efaaaa;--processing-bg:#263341;--processing:#b5d0e8}}
*{box-sizing:border-box}
body{font-family:Arial,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;background:var(--page);color:var(--text);margin:0;padding:36px 20px;display:flex;justify-content:center;transition:background .18s,color .18s}
.container{max-width:680px;width:100%;background:var(--panel);padding:30px;border:1px solid var(--line);border-radius:0;box-shadow:none}
.topbar{display:flex;justify-content:flex-end;margin:-10px -10px 12px}
.theme-btn{background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:0;padding:7px 11px;font-size:12px;cursor:pointer}
h1{font-size:22px;font-weight:650;letter-spacing:.01em;margin:0 0 7px;text-align:center;color:var(--text)}
p.desc{font-size:13px;color:var(--muted);text-align:center;margin:0 0 28px;line-height:1.7}
.setting-group{margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;gap:16px;background:var(--surface);padding:14px;border-radius:0;border:1px solid var(--line)}
.setting-group label{font-weight:600;color:var(--text);font-size:14px}
.setting-group input{width:96px;padding:9px 8px;background:var(--field);color:var(--text);border:1px solid var(--line);border-radius:0;font-size:16px;text-align:center}
.drop-zone{border:1px dashed var(--accent);border-radius:0;padding:38px 20px;text-align:center;cursor:pointer;background:var(--drop);transition:background .15s,border-color .15s;margin-bottom:24px}
.drop-zone:hover,.drop-zone.dragover{background:var(--drop-hover);border-style:solid}
.drop-zone p{margin:0;font-size:15px;color:var(--text);font-weight:600}
.drop-zone span{display:block;font-size:12px;color:var(--muted);margin-top:9px}
#file-input{display:none}
.download-action-area{margin:20px 0;text-align:center;display:none}
.download-btn{background:var(--accent);color:#fff;border:1px solid var(--accent);padding:11px 24px;font-size:14px;font-weight:600;border-radius:0;cursor:pointer;transition:background .15s}
.download-btn:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.status-area{margin-top:20px;max-height:250px;overflow-y:auto}
.log-msg{padding:11px 13px;border-radius:0;font-size:13px;margin-bottom:8px;line-height:1.55;border:1px solid var(--line)}
.log-msg.processing{background:var(--processing-bg);color:var(--processing);border-left:3px solid var(--accent);font-weight:600}
.log-msg.success{background:var(--success-bg);color:var(--success)}
.log-msg.error{background:var(--error-bg);color:var(--error)}
button:focus-visible,.drop-zone:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media(max-width:520px){body{padding:16px 10px}.container{padding:20px 15px}.setting-group{align-items:flex-start;flex-direction:column}.setting-group input{width:100%}}
</style>
</head>
<body>

<div class="container">
    <div class="topbar"><button class="theme-btn" id="theme-btn" type="button">ダークモード</button></div>
    <h1>Font Side-Bearing Fixer</h1>
    <p class="desc">フォントの左右余白を指定値に調整し、複数ファイルをまとめてZIP出力します。</p>

    <div class="setting-group">
        <label for="sb-input">左右余白（Side Bearing）:</label>
        <input type="number" id="sb-input" value="30">
    </div>

    <div class="drop-zone" id="drop-zone">
        <p>フォントファイルをドロップするかクリックして選択</p>
        <span>対応フォーマット: .ttf / .otf</span>
        <input type="file" id="file-input" accept=".ttf,.otf" multiple>
    </div>

    <div class="download-action-area" id="download-action-area">
        <button class="download-btn" id="download-btn">ZIPを再ダウンロード</button>
    </div>

    <div class="status-area" id="status-area"></div>
</div>

<script>
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    const sbInput = document.getElementById('sb-input');
    const statusArea = document.getElementById('status-area');
    const downloadActionArea = document.getElementById('download-action-area');
    const downloadBtn = document.getElementById('download-btn');
    const themeBtn = document.getElementById('theme-btn');
    const savedTheme = localStorage.getItem('font-tool-theme');
    if (savedTheme === 'dark' || savedTheme === 'light') document.documentElement.dataset.theme = savedTheme;
    function updateThemeButton() { themeBtn.textContent = document.documentElement.dataset.theme === 'dark' ? 'ライトモード' : 'ダークモード'; }
    updateThemeButton();
    themeBtn.addEventListener('click', () => { const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = next; localStorage.setItem('font-tool-theme', next); updateThemeButton(); });

    // カーニングや関連メトリクスのテーブルを削除対象にする
    const BAD_TABLES = [
        'GSUB', 'GPOS', 'DSIG', 'hdmx', 'LTSH', 'PCLT', 'VDMX',
        'kern', 'vkrn', 'vmtx', 'vhea', 'VORG', 'BASE', 'GDEF', 'JSTF'
    ];
    const yieldToBrowser = () => new Promise(resolve => setTimeout(resolve, 0));

    let currentZipUrl = null;
    let currentZipName = "";

    ['dragenter', 'dragover'].forEach(eventName => {
        dropZone.addEventListener(eventName, (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        }, false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
        dropZone.addEventListener(eventName, (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
        }, false);
    });

    dropZone.addEventListener('click', () => fileInput.click());
    
    fileInput.addEventListener('change', (e) => handleFiles(e.target.files));
    dropZone.addEventListener('drop', (e) => handleFiles(e.dataTransfer.files));

    downloadBtn.addEventListener('click', () => {
        if (currentZipUrl) {
            const a = document.createElement('a');
            a.href = currentZipUrl;
            a.download = currentZipName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
    });

    async function handleFiles(files) {
        if (files.length === 0) return;
        
        if (currentZipUrl) {
            URL.revokeObjectURL(currentZipUrl);
            currentZipUrl = null;
        }
        downloadActionArea.style.display = 'none';
        statusArea.innerHTML = ''; 

        const sb = parseInt(sbInput.value, 10) || 0;
        const zip = new JSZip();
        let successCount = 0;

        const mainLogId = 'main-log';
        showLog(`合計 ${files.length} 個のフォントを処理しています`, 'processing', mainLogId);
        await yieldToBrowser();

        for (const file of Array.from(files)) {
            const subLogId = 'log-' + Math.random().toString(36).substr(2, 9);
            
            showLog(`${file.name} を処理しています`, 'processing', subLogId);
            await yieldToBrowser();

            try {
                const arrayBuffer = await readFileAsArrayBuffer(file);
                const font = opentype.parse(arrayBuffer);

                // フォントオブジェクトが保持するカーニング情報を消去する
                if (font.kerningPairs) {
                    font.kerningPairs = {};
                }

                for (let i = 0; i < font.numGlyphs; i++) {
                    const glyph = font.glyphs.get(i);
                    const name = glyph.name;

                    if (name === 'space' || name === 'uni3000' || name === '.notdef') {
                        continue;
                    }

                    if (glyph.xMin !== undefined && glyph.xMax !== undefined) {
                        const origWidth = glyph.xMax - glyph.xMin;
                        glyph.leftSideBearing = sb;
                        glyph.advanceWidth = sb + origWidth + sb;
                    } else {
                        glyph.leftSideBearing = sb;
                        glyph.advanceWidth = sb * 2;
                    }
                }

                if (font.tables) {
                    BAD_TABLES.forEach(table => {
                        if (font.tables[table.toLowerCase()]) {
                            delete font.tables[table.toLowerCase()];
                        }
                    });
                }

                const lastDot = file.name.lastIndexOf('.');
                const baseName = file.name.substring(0, lastDot);
                const ext = file.name.substring(lastDot);
                const outputFilename = `fixed_${baseName}${ext}`;

                const fontBuffer = font.toArrayBuffer();
                zip.file(outputFilename, fontBuffer);

                updateLog(subLogId, `完了: ${outputFilename}`, 'success');
                successCount++;


            } catch (err) {
                updateLog(subLogId, `エラー: ${file.name} (${err.message})`, 'error');
                console.error(err);
            }
        }

        if (successCount > 0) {
            updateLog(mainLogId, `ZIPファイルを生成しています`, 'processing');
            await yieldToBrowser();
            
            const timestamp = Math.floor(Date.now() / 1000);
            const zipBlob = await zip.generateAsync({ type: 'blob', compression: 'STORE', streamFiles: true });
            
            currentZipUrl = URL.createObjectURL(zipBlob);
            currentZipName = `fonts_fixed_${timestamp}.zip`;
            
            const a = document.createElement('a');
            a.href = currentZipUrl;
            a.download = currentZipName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);

            downloadActionArea.style.display = 'block';

            updateLog(mainLogId, `処理が完了しました。自動保存されない場合は上のボタンから取得できます。`, 'success');
        } else {
            updateLog(mainLogId, `処理に成功したフォントがありませんでした。`, 'error');
        }
    }

    function readFileAsArrayBuffer(file) {
        return file.arrayBuffer();
    }

    function showLog(message, type, id) {
        const div = document.createElement('div');
        div.id = id;
        div.className = `log-msg ${type}`;
        div.textContent = message;
        statusArea.appendChild(div);
        statusArea.scrollTop = statusArea.scrollHeight;
    }

    function updateLog(id, message, type) {
        const div = document.getElementById(id);
        if (div) {
            div.className = `log-msg ${type}`;
            div.textContent = message;
        }
    }
</script>

</body>
</html>
