<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Font Side-Bearing Fixer</title>
    <script src="https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f5f7fa;
            color: #333;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 650px;
            width: 100%;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h1 {
            font-size: 24px;
            margin-bottom: 5px;
            text-align: center;
            color: #2c3e50;
        }
        p.desc {
            font-size: 14px;
            color: #7f8c8d;
            text-align: center;
            margin-bottom: 25px;
        }
        .setting-group {
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }
        .setting-group label {
            font-weight: bold;
            color: #4a5568;
        }
        .setting-group input {
            width: 80px;
            padding: 8px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 16px;
            text-align: center;
        }
        .drop-zone {
            border: 2px dashed #3498db;
            border-radius: 8px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            background-color: #f0f8ff;
            transition: background-color 0.2s, border-color 0.2s;
            margin-bottom: 25px;
        }
        .drop-zone:hover, .drop-zone.dragover {
            background-color: #e1f0fa;
            border-color: #2980b9;
        }
        .drop-zone p {
            margin: 0;
            font-size: 16px;
            color: #34495e;
            font-weight: bold;
        }
        .drop-zone span {
            display: block;
            font-size: 12px;
            color: #95a5a6;
            margin-top: 8px;
        }
        #file-input {
            display: none;
        }
        .status-area {
            margin-top: 20px;
            max-height: 250px;
            overflow-y: auto;
        }
        .log-msg {
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 10px;
            line-height: 1.4;
        }
        .log-msg.processing {
            background-color: #ebf5fb;
            color: #2980b9;
            border: 1px solid #a9cce3;
            font-weight: bold;
        }
        .log-msg.success {
            background-color: #e8f8f5;
            color: #27ae60;
            border: 1px solid #a3e4d7;
        }
        .log-msg.error {
            background-color: #fdebd0;
            color: #e67e22;
            border: 1px solid #fadbd8;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Font Side-Bearing Fixer</h1>
    <p class="desc">直接テーブル書き換え版。余白を均一に調整し、まとめてZIP出力します。</p>

    <div class="setting-group">
        <label for="sb-input">左右余白（Side Bearing）:</label>
        <input type="number" id="sb-input" value="30">
    </div>

    <div class="drop-zone" id="drop-zone">
        <p>複数のフォントファイルをドロップするか、ここをクリック</p>
        <span>対応フォーマット: .ttf / .otf</span>
        <input type="file" id="file-input" accept=".ttf,.otf" multiple>
    </div>

    <div class="status-area" id="status-area"></div>
</div>

<script>
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    const sbInput = document.getElementById('sb-input');
    const statusArea = document.getElementById('status-area');

    const BAD_TABLES = ['GSUB', 'GPOS', 'DSIG', 'hdmx', 'LTSH', 'PCLT', 'VDMX'];

    // 画面の更新（描画）を強制的に待つためのタイマー関数
    const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

    ['dragenter', 'dragover'].forEach(eventName => {
        dropZone.addEventListener(eventName, (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        }, false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
        dropZone.addEventListener(eventName, (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
        }, false);
    });

    dropZone.addEventListener('click', () => fileInput.click());
    
    fileInput.addEventListener('change', (e) => handleFiles(e.target.files));
    dropZone.addEventListener('drop', (e) => handleFiles(e.dataTransfer.files));

    async function handleFiles(files) {
        if (files.length === 0) return;
        statusArea.innerHTML = ''; // ログクリア

        const sb = parseInt(sbInput.value, 10) || 0;
        const zip = new JSZip();
        let successCount = 0;

        const mainLogId = 'main-log';
        showLog(`⏳ 合計 ${files.length} 個のフォントの処理を開始するヨ...`, 'processing', mainLogId);
        await sleep(300); // 開始メッセージを出すためにちょっと待つネ

        for (const file of Array.from(files)) {
            const subLogId = 'log-' + Math.random().toString(36).substr(2, 9);
            
            // 【ココを改善！】ハッキリ「処理中」と表示させて、少し待つコトで画面に表示させるヨ
            showLog(`⏳ ${file.name} を処理中... 少々お待ちください...`, 'processing', subLogId);
            await sleep(200); // 画面に「処理中」を表示させるためのウェイト

            try {
                const arrayBuffer = await readFileAsArrayBuffer(file);
                const font = opentype.parse(arrayBuffer);

                // 余白の調整処理
                for (let i = 0; i < font.numGlyphs; i++) {
                    const glyph = font.glyphs.get(i);
                    const name = glyph.name;

                    if (name === 'space' || name === 'uni3000' || name === '.notdef') {
                        continue;
                    }

                    if (glyph.xMin !== undefined && glyph.xMax !== undefined) {
                        const origWidth = glyph.xMax - glyph.xMin;
                        glyph.leftSideBearing = sb;
                        glyph.advanceWidth = sb + origWidth + sb;
                    } else {
                        glyph.leftSideBearing = sb;
                        glyph.advanceWidth = sb * 2;
                    }
                }

                if (font.tables) {
                    BAD_TABLES.forEach(table => {
                        if (font.tables[table.toLowerCase()]) {
                            delete font.tables[table.toLowerCase()];
                        }
                    });
                }

                const lastDot = file.name.lastIndexOf('.');
                const baseName = file.name.substring(0, lastDot);
                const ext = file.name.substring(lastDot);
                const outputFilename = `fixed_${baseName}${ext}`;

                const fontBuffer = font.toArrayBuffer();
                zip.file(outputFilename, fontBuffer);

                // 処理が終わったら成功に上書きするヨ
                updateLog(subLogId, `✅ Success: ${outputFilename}`, 'success');
                successCount++;
                await sleep(100);

            } catch (err) {
                updateLog(subLogId, `❌ Error: ${file.name} (${err.message})`, 'error');
                console.error(err);
            }
        }

        if (successCount > 0) {
            updateLog(mainLogId, `📦 ZIPファイルを生成しているヨ... ダウンロードをお待ちくださいネ。`, 'processing');
            await sleep(300);
            
            const timestamp = Math.floor(Date.now() / 1000);
            const zipBlob = await zip.generateAsync({ type: 'blob' });
            
            const url = URL.createObjectURL(zipBlob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `fonts_fixed_${timestamp}.zip`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            updateLog(mainLogId, `🎉 すべて完了！ ${successCount} 個のフォントをZIPにまとめたヨ！`, 'success');
        } else {
            updateLog(mainLogId, `❌ 処理に成功したフォントがなかったヨ。`, 'error');
        }
    }

    function readFileAsArrayBuffer(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = (e) => resolve(e.target.result);
            reader.onerror = (e) => reject(new Error("ファイルの読み込みに失敗しました"));
            reader.readAsArrayBuffer(file);
        });
    }

    function showLog(message, type, id) {
        const div = document.createElement('div');
        div.id = id;
        div.className = `log-msg ${type}`;
        div.innerHTML = message;
        statusArea.appendChild(div);
        statusArea.scrollTop = statusArea.scrollHeight;
    }

    function updateLog(id, message, type) {
        const div = document.getElementById(id);
        if (div) {
            div.className = `log-msg ${type}`;
            div.innerHTML = message;
        }
    }
</script>

</body>
</html>
